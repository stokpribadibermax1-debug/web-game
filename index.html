<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Katalog Game</title>
</head>
<body>
  <div id="game-feed-container" style="display: flex; flex-wrap: wrap; gap: 15px; justify-content: center;"></div>

  <script>
    const feedUrl = 'https://gamemonetize.com/feed.php?format=0&num=50&page=1';
    fetch(feedUrl)
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('game-feed-container');
        data.forEach(game => {
          container.innerHTML += `
            <div style="width:150px;border:1px solid #e0e0e0;border-radius:8px;padding:10px;text-align:center;">
              <img src="${game.thumb}" alt="${game.title}" style="width:100%;height:100px;object-fit:cover;border-radius:6px;">
              <h4 style="font-size:13px;margin:8px 0;height:32px;overflow:hidden;">${game.title}</h4>
              <a href="${game.url}" target="_blank" rel="noopener" style="display:block;padding:7px 0;background:#28a745;color:#fff;text-decoration:none;border-radius:5px;font-size:12px;font-weight:bold;">Mainkan</a>
            </div>`;
        });
      })
      .catch(error => console.error('Gagal memuat game feed:', error));
  </script>
</body>
