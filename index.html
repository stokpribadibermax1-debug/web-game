<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcade Games - Main Gratis Online</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #12141c;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  }
  .layout { display: flex; min-height: 100vh; }
  .sidebar {
    width: 64px; background: #1a1d29; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 0; gap: 22px;
  }
  .sidebar .icon {
    width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
    color: #8892b0; font-size: 18px; cursor: pointer;
  }
  .sidebar .icon:hover { color: #fff; }
  @media (max-width: 700px) { .sidebar { display: none; } }
  .main { flex: 1; min-width: 0; }
  .topbar { background: linear-gradient(135deg, #7b2ff7, #4f8cff); padding: 20px 24px 30px; }
  .topbar-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
  .logo { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  #searchBox {
    flex: 1; min-width: 200px; max-width: 600px;
    background: rgba(20,22,35,0.55); border: none; border-radius: 10px;
    padding: 12px 16px; color: #fff; font-size: 14px; outline: none;
  }
  #searchBox::placeholder { color: #c7cbe6; }
  .features { display: flex; gap: 24px; flex-wrap: wrap; font-size: 13px; color: #eef0ff; opacity: 0.9; }
  .features span { display: flex; align-items: center; gap: 6px; }
  main.content { max-width: 1300px; margin: 0 auto; padding: 24px; }
  #gameCount { color: #7a7f8f; font-size: 13px; margin-bottom: 14px; }
  #game-feed-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
  .game-card {
    background: #1a1d29; border-radius: 12px; overflow: hidden;
    text-decoration: none; color: #fff; display: block;
    border: 1px solid #262a38; transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .game-card:hover { transform: translateY(-4px); border-color: #7b2ff7; }
  .thumb-wrap { position: relative; aspect-ratio: 1 / 1; background: #262a38; overflow: hidden; }
  .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .play-overlay {
    position: absolute; inset: 0; background: rgba(15,17,23,0.55);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.15s ease;
  }
  .game-card:hover .play-overlay { opacity: 1; }
  .play-overlay .btn {
    background: linear-gradient(135deg, #7b2ff7, #4f8cff);
    color: #fff; font-weight: 700; font-size: 12px; padding: 8px 16px; border-radius: 20px;
  }
  .game-info { padding: 10px 12px; }
  .game-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .loading, .empty { text-align: center; color: #7a7f8f; padding: 40px 0; font-size: 14px; }
  footer { text-align: center; color: #5c6070; font-size: 12px; padding: 30px 20px; border-top: 1px solid #1a1d29; margin-top: 30px; }
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <div class="icon">🏠</div>
    <div class="icon">⭐</div>
    <div class="icon">🕹️</div>
    <div class="icon">🧩</div>
    <div class="icon">🏁</div>
    <div class="icon">🔥</div>
    <div class="icon">🎯</div>
    <div class="icon">☰</div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-row">
        <div class="logo">🕹️ Arcade<span style="opacity:.85">Games</span></div>
        <input type="text" id="searchBox" placeholder="Search">
      </div>
      <div class="features">
        <span>🎮 4000+ Games</span>
        <span>🚀 No Install Needed</span>
        <span>💻 On any devices</span>
        <span>👥 Play with friends</span>
        <span>✨ All for free</span>
      </div>
    </div>
    <main class="content">
      <div id="gameCount" class="loading">Memuat game...</div>
      <div id="game-feed-container"></div>
    </main>
    <footer>&copy; 2026 ArcadeGames. Powered by GameMonetize.</footer>
  </div>
</div>
<script>
  const feedUrl = 'https://gamemonetize.com/feed.php?format=0&num=50&page=1';
  let allGames = [];
  const container = document.getElementById('game-feed-container');
  const countLabel = document.getElementById('gameCount');
  const searchBox = document.getElementById('searchBox');

  function renderGames(games) {
    container.innerHTML = '';
    if (games.length === 0) {
      container.innerHTML = '<div class="empty">Game tidak ditemukan.</div>';
      return;
    }
    games.forEach(game => {
      const card = document.createElement('a');
      card.href = game.url;
      card.target = '_blank';
      card.rel = 'noopener';
      card.className = 'game-card';
      card.innerHTML = `
        <div class="thumb-wrap">
          <img src="${game.thumb}" alt="${game.title}" loading="lazy">
          <div class="play-overlay"><span class="btn">Mainkan</span></div>
        </div>
        <div class="game-info"><div class="game-title">${game.title}</div></div>`;
      container.appendChild(card);
    });
  }

  fetch(feedUrl)
    .then(response => response.json())
    .then(data => {
      allGames = data;
      countLabel.textContent = `${data.length} game tersedia`;
      countLabel.classList.remove('loading');
      renderGames(allGames);
    })
    .catch(error => {
      countLabel.textContent = 'Gagal memuat game. Coba refresh halaman.';
      console.error('Gagal memuat game feed:', error);
    });

  searchBox.addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    const filtered = allGames.filter(g => g.title.toLowerCase().includes(q));
    renderGames(filtered);
  });
</script>
</body>
</html>
