<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog Game - Main Gratis Online</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f1117;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(135deg, #1a1d29, #0f1117);
    border-bottom: 1px solid #2a2d3a;
    padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    flex-wrap: wrap;
  }
  header .logo { font-size: 20px; font-weight: 800; color: #fff; white-space: nowrap; }
  header .logo span { color: #6c8cff; }
  #searchBox {
    flex: 1; max-width: 360px; min-width: 160px;
    background: #1a1d29; border: 1px solid #2a2d3a; border-radius: 8px;
    padding: 10px 14px; color: #fff; font-size: 14px; outline: none;
  }
  #searchBox::placeholder { color: #7a7f8f; }
  .hero { padding: 32px 20px 12px; text-align: center; }
  .hero h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
  .hero p { color: #9aa0b0; font-size: 14px; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px; }
  #gameCount { color: #7a7f8f; font-size: 13px; margin-bottom: 14px; }
  #game-feed-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
  }
  .game-card {
    background: #1a1d29; border-radius: 12px; overflow: hidden;
    text-decoration: none; color: #fff; display: block;
    border: 1px solid #262a38;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .game-card:hover { transform: translateY(-4px); border-color: #6c8cff; }
  .thumb-wrap { position: relative; aspect-ratio: 1 / 1; background: #262a38; overflow: hidden; }
  .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .play-overlay {
    position: absolute; inset: 0; background: rgba(15,17,23,0.55);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.15s ease;
  }
  .game-card:hover .play-overlay { opacity: 1; }
  .play-overlay .btn {
    background: #28a745; color: #fff; font-weight: 700; font-size: 12px;
    padding: 8px 16px; border-radius: 20px;
  }
  .game-info { padding: 10px 12px; }
  .game-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .loading, .empty { text-align: center; color: #7a7f8f; padding: 40px 0; font-size: 14px; }
  footer { text-align: center; color: #5c6070; font-size: 12px; padding: 30px 20px; border-top: 1px solid #1a1d29; margin-top: 30px; }
</style>
</head>
<body>
<header>
  <div class="logo">🎮 Game<span>Zone</span></div>
  <input type="text" id="searchBox" placeholder="Cari game...">
</header>
<div class="hero">
  <h1>Main Game Online Gratis</h1>
  <p>Ratusan game seru, langsung main tanpa download</p>
</div>
<main>
  <div id="gameCount" class="loading">Memuat game...</div>
  <div id="game-feed-container"></div>
</main>
<footer>&copy; 2026 GameZone. Powered by GameMonetize.</footer>
<script>
  const feedUrl = 'https://gamemonetize.com/feed.php?format=0&num=50&page=1';
  let allGames = [];
  const container = document.getElementById('game-feed-container');
  const countLabel = document.getElementById('gameCount');
  const searchBox = document.getElementById('searchBox');

  function renderGames(games) {
    container.innerHTML = '';
    if (games.length === 0) {
      container.innerHTML = '<div class="empty">Game tidak ditemukan.</div>';
      return;
    }
    games.forEach(game => {
      const card = document.createElement('a');
      card.href = game.url;
      card.target = '_blank';
      card.rel = 'noopener';
      card.className = 'game-card';
      card.innerHTML = `
        <div class="thumb-wrap">
          <img src="${game.thumb}" alt="${game.title}" loading="lazy">
          <div class="play-overlay"><span class="btn">Mainkan</span></div>
        </div>
        <div class="game-info"><div class="game-title">${game.title}</div></div>`;
      container.appendChild(card);
    });
  }

  fetch(feedUrl)
    .then(response => response.json())
    .then(data => {
      allGames = data;
      countLabel.textContent = `${data.length} game tersedia`;
      countLabel.classList.remove('loading');
      renderGames(allGames);
    })
    .catch(error => {
      countLabel.textContent = 'Gagal memuat game. Coba refresh halaman.';
      console.error('Gagal memuat game feed:', error);
    });

  searchBox.addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    const filtered = allGames.filter(g => g.title.toLowerCase().includes(q));
    renderGames(filtered);
  });
</script>
</body>
</html>
